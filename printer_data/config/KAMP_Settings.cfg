#######################################
# KAMP - Klipper Adaptive Meshing & Purging
#######################################
# KAMP adapts bed mesh and purge line to the actual print area,
# saving time by only meshing and purging where needed.
#
# See: https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging
#
# Included features:
#   Adaptive_Meshing - Only mesh the area being printed
#   Line_Purge       - Purge line near the print area
#   Smart_Park       - Park near print area before final hotend warmup
#
# Note: EXCLUDE_OBJECT must be enabled in printer.cfg (it is) and
# your slicer must be configured to label objects in the gcode.


#######################################
# KAMP Feature Includes
#######################################

[include ./KAMP/Adaptive_Meshing.cfg]       # Adaptive meshing - only mesh the print area
[include ./KAMP/Line_Purge.cfg]             # Purge line near print area before printing
#[include ./KAMP/Voron_Purge.cfg]           # Voron logo purge - alternative to Line_Purge
[include ./KAMP/Smart_Park.cfg]             # Park near print area before final hotend warmup


#######################################
# KAMP Settings
#######################################

[gcode_macro _KAMP_Settings]
description: Adjustable settings for KAMP adaptive meshing and purging

# General settings
variable_verbose_enable: True               # Enable KAMP console output for debugging

# Adaptive mesh settings
variable_mesh_margin: 5                     # Expand mesh area by this many mm beyond print area
variable_fuzz_amount: 0                     # Randomize mesh points slightly to spread probe wear
                                            # Leave at 0 for Beacon (non-contact probe)

# Dockable probe settings (Klicky, Euclid etc.)       # ----------------  Attach Macro | Detach Macro
variable_probe_dock_enable: False           # Set True if using a dockable probe               # ---------------------------------------------
variable_attach_macro: 'Attach_Probe'       # Macro to attach probe                            # Klicky:  'Attach_Probe' | 'Dock_Probe'
variable_detach_macro: 'Dock_Probe'         # Macro to detach probe                            # Euclid:  'Deploy_Probe' | 'Stow_Probe'
                                                                                               # Legacy:  'M401'         | 'M402'

# Line purge settings
# Note: LINE_PURGE is called from slicer end gcode, separate from CLEAN_NOZZLE
variable_purge_height: 0.6                  # Z height during purge line (mm)
variable_tip_distance: 3.0                  # Distance between filament tip and nozzle before purge
                                            # Should match PRINT_END final retract amount
variable_purge_margin: 10                   # Distance purge line is placed from print area (mm)
variable_purge_amount: 40                   # Amount of filament to purge (mm)
variable_flow_rate: 10                      # Purge flow rate (mm3/s)

# Plus4 specific bed limits
variable_print_bed_max_x: 307               # Maximum X travel over build plate
variable_print_bed_max_y: 300               # Maximum Y travel over build plate
                                            # Limited to 300 on Plus4 due to back-left stepper motor exclusion zone

# Smart Park settings
variable_smart_park_height: 10              # Z height when parked near print area (mm)

gcode:
    {action_respond_info("_KAMP_Settings stores KAMP configuration only - no action taken")}