#######################################
# TMC Autotune Configuration
#######################################
# TMC Autotune automatically calculates optimal stepper motor driver
# settings based on motor specifications and tuning goals.
#
# tuning_goal options:
#   performance - maximum speed and torque, more noise
#   silent      - quieter operation, less torque
#   auto        - balanced, Autotune decides based on use case
#
# sgt: StallGuard threshold for sensorless homing (X/Y only)
#   Lower values = more sensitive, higher values = less sensitive
#   Tune if homing is unreliable or triggers false positives
#
# See: https://github.com/andrewmcgr/klipper_tmc_autotune


#######################################
# XY Steppers - TMC2240
#######################################
# Performance tuning for fast XY movements
# sgt=1 for reliable sensorless homing

[autotune_tmc stepper_x]
motor: qidi-BJ42D29-28V17
tuning_goal: performance
voltage: 24
sgt: 1

[autotune_tmc stepper_y]
motor: qidi-BJ42D29-28V17
tuning_goal: performance
voltage: 24
sgt: 1


#######################################
# Z Steppers - TMC2209
#######################################
# Silent tuning for Z - reduces noise during printing
# No sgt needed - Z uses physical endstop via Beacon

[autotune_tmc stepper_z]
motor: qidi-BJ42D29-22V08
tuning_goal: silent
voltage: 24

[autotune_tmc stepper_z1]
motor: qidi-BJ42D29-22V08
tuning_goal: silent
voltage: 24


#######################################
# Extruder - TMC2209
#######################################
# Auto tuning - Autotune balances performance and noise
# for the LDO extruder motor

[autotune_tmc extruder]
motor: ldo-42sth48-2504ah
tuning_goal: auto
voltage: 24