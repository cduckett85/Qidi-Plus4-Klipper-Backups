#######################################
# Crowsnest Camera Configuration
#######################################
# Crowsnest manages USB camera streaming for Mainsail/Fluidd.
# Cameras are accessible via:
#   Port 8080 = /webcam/?action=[stream/snapshot]
#   Port 8081 = /webcam2/?action=[stream/snapshot]
#   Port 8082 = /webcam3/?action=[stream/snapshot]
#
# To identify a newly connected USB camera device path:
#   ls /dev/v4l/by-id/
# To check supported resolutions and framerates:
#   v4l2-ctl --device=/dev/video0 --list-formats-ext
#
# See: https://github.com/mainsail-crew/crowsnest/blob/master/README.md


#######################################
# Global Settings
#######################################

[crowsnest]
log_path: /home/mks/printer_data/logs/crowsnest.log
log_level: verbose                      # Change to quiet once everything is working stable
delete_log: true                        # Delete log on every restart to avoid log bloat
no_proxy: false                         # Only change if you know what you are doing


#######################################
# Cam 1 - Current USB Chamber Camera
#######################################
# Stock Qidi Plus4 USB camera
# When replacing with Nebula, comment out this section and enable cam 2 below

[cam 1]
mode: ustreamer                         # ustreamer - MJPG and snapshots, works on all devices
                                        # camera-streamer - WebRTC, MJPG and snapshots (RPi only)
enable_rtsp: false                      # Enable RTSP stream (camera-streamer only)
rtsp_port: 8554                         # RTSP port (set different port per camera)
port: 8080                              # HTTP/MJPG stream port
device: /dev/v4l/by-id/usb-SYX-231020-J_HD_Camera-video-index0
resolution: 1920x1080
max_fps: 16                             # Conservative fps for RK3328 CPU

# # Alternative Plus4 USB camera
# device: /dev/v4l/by-id/usb-icSpring_icspring_camera24091116320721-video-index0
# resolution: 640x480
# max_fps: 16


