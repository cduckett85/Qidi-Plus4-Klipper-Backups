#######################################
# FreeDi Configuration
#######################################
# FreeDi provides the touchscreen display interface for the Qidi Plus4.
# Note: Restart the FreeDi service after changing this file:
#   sudo systemctl restart freedi

[freedi]

#######################################
# Hardware Settings
#######################################
printer_model: plus4                        # Printer model for FreeDi
baudrate: 921600                            # Serial baud rate - stock mainboard: 921600
serial_port: /dev/ttyS1                     # LCD serial port
url: 127.0.0.1                              # Moonraker URL
moonraker_port: 7125                        # Moonraker port
webUI_port: 80                              # Fluidd/Mainsail port (80=Fluidd, 81=Mainsail)
api_key: 8cbd5ce2a0e74641928e8cefb269eb06   # Moonraker API key - update with actual key
klippy_socket: /home/mks/printer_data/comms/klippy.sock


#######################################
# Update Channel
#######################################
channel: stable                             # stable or beta (beta may have bugs)
wizard: False                               # Enable FreeDi setup wizard


#######################################
# Display Default Temperatures & Speeds
#######################################
default_temp_extruder: 220                  # Default extruder temp on display
default_temp_bed: 60                        # Default bed temp on display
default_temp_chamber: 45                    # Default chamber temp on display
default_speed_partfan: 100                  # Default part cooling fan speed %
default_speed_sidefan: 100                  # Default side fan speed %
default_speed_filterfan: 100                # Default filter fan speed %


#######################################
# Display Settings
#######################################
sync_case_light_with_display: True          # Sync case light with display on/off
default_brightness: 100                     # Display brightness %
lcd_dim_time: 10                            # Minutes before dimming (0 to disable)
lcd_dim_brightness: 20                      # Dimmed brightness %
lcd_sleep_time: 20                          # Minutes before sleep (0 to disable)


#######################################
# Extruder Menu Settings
#######################################
# Default extrusion lengths for the Extruder menu
extruder_length_1: 10.0
extruder_length_2: 20.0
extruder_length_3: 50.0                     # Default extrude value

# Default move lengths for Move and Move&Extrude menus
move_extrude_length_1: 0.1
move_extrude_length_2: 1.0
move_extrude_length_3: 10.0                 # Default move value
move_extrude_length_4: 50.0
move_extrude_length_5: 100.0


#######################################
# Display Preset Names
#######################################
# These names appear on the home screen preset buttons
# Match these to your PRESET_MACRO definitions below
preset1_name: PLA
preset2_name: ASA                           # Changed from ABS to ASA - primary material
preset3_name: PETG
preset4_name: TPU


#######################################
# Future Features (Not Yet Integrated)
#######################################
touch_acoustic_feedback: True               # Acoustic feedback on touch events
install_klipper_module: False               # Toggle to install klipper module
flash_MCU: False                            # Toggle to flash MCU
flash_toolhead: False                       # Toggle to flash toolhead
flash_display: False                        # Toggle to flash display


#######################################
# Display Preset Macros
#######################################
# These macros are triggered by the preset buttons on the display home screen.
# Customize temperatures to match your typical print settings per material.

[gcode_macro PRESET_MACRO_1]
description: PLA preset temperatures
gcode:
    M104 S210                               # Extruder temp
    M140 S60                                # Bed temp
    M141 S0                                 # Chamber temp (off for PLA)

[gcode_macro PRESET_MACRO_2]
description: ASA preset temperatures
gcode:
    M104 S260                               # Extruder temp
    M140 S100                               # Bed temp
    M141 S45                                # Chamber temp

[gcode_macro PRESET_MACRO_3]
description: PETG preset temperatures
gcode:
    M104 S240                               # Extruder temp
    M140 S70                                # Bed temp
    M141 S0                                 # Chamber temp (off for PETG)

[gcode_macro PRESET_MACRO_4]
description: TPU preset temperatures
gcode:
    M104 S250                               # Extruder temp
    M140 S40                                # Bed temp
    M141 S0                                 # Chamber temp (off for TPU)