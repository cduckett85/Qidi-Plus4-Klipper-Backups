#######################################
# Bed Mesh Mode Control
#######################################
# G31 = KAMP adaptive mesh mode (default)
# G32 = Full bed mesh mode
# G29 = Full bed preparation sequence (homing, z-tilt, mesh)

[gcode_macro G31]
description: Enable KAMP adaptive bed meshing profile
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=1

[gcode_macro G32]
description: Enable default full bed meshing profile
gcode:
    SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=0

[gcode_macro G29]
variable_k: 1
description: Prepare print bed, generate a bed mesh, and apply global Z nozzle offset
gcode:
    _FIND_Z_EQUALS_ZERO                                            # The user must make sure that nothing else homes Z after this call
    {% if k|int==1 %}
        BED_MESH_CALIBRATE PROFILE=kamp                            # KAMP adaptive mesh
        BED_MESH_PROFILE LOAD=kamp
        SAVE_VARIABLE VARIABLE=profile_name VALUE='"kamp"'
    {% else %}
        BED_MESH_CALIBRATE PROFILE=default                         # Full bed mesh
        BED_MESH_PROFILE LOAD=default
        SAVE_VARIABLE VARIABLE=profile_name VALUE='"default"'
        SET_GCODE_VARIABLE MACRO=G29 VARIABLE=k VALUE=1            # Reactivate KAMP/Adaptive mode for next time
    {% endif %}


#######################################
# Bed Settling
#######################################
# _SETTLE_PRINT_BED is called by _FIND_Z_EQUALS_ZERO to stabilize
# the bed springs before contact probing

[gcode_macro _SETTLE_PRINT_BED]
description: Vibrate bed up and down to settle any movement in the springs
gcode:
    G1 Z4 F600                              # Move to Z=4
    G91                                     # Enter relative positioning mode
    M400                                    # Wait for all prior commands to finish
    {% for z in range(50) %}                # Loop 50 times
        G1 Z1 F5000                         # Move bed down by 1mm
        G1 Z-1 F5000                        # Move bed up by 1mm
    {% endfor %}
    G90                                     # Go back to absolute positioning mode
    M400                                    # Wait for all prior commands to finish
    G1 Z4 F600                              # Make sure Z=4mm before we leave the macro


#######################################
# Bed Tramming
#######################################

[gcode_macro PLATFORM_CALIBRATE]
description: Ram bed into frame stops to mechanically auto-level Z
gcode:
    {% set HOME_CURRENT = 0.7 %}
    {% set RUN_CURRENT_Z = printer.configfile.settings['tmc2209 stepper_z'].run_current|float %}
    {% set RUN_CURRENT_Z1 = printer.configfile.settings['tmc2209 stepper_z1'].run_current|float %}
    {% set ZMAX = printer.configfile.settings['stepper_z'].position_max|int %}
    SET_GCODE_OFFSET Z=0
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}

    G28 Z                                                       # Rehome Z

    G0 Z275 F600                                                # Run Z nearly to ZMAX

    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={HOME_CURRENT}    # Lower Z current
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={HOME_CURRENT}

    G0 Z{ZMAX} F50                                              # Ram Z into platform stops

    M400                                                        # Wait for StallGuard to clear

    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={RUN_CURRENT_Z}   # Restore Z current
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT={RUN_CURRENT_Z1}

    G0 Z25 F600                                                 # Move Z back down


#######################################
# Beacon-Based Bed Tramming
#######################################
# Uses Beacon proximity probing to measure Z offset at each bed adjustment
# screw position. Much more accurate than the paper/nozzle drag method.
#
# Usage:
# 1. Heat bed to printing temperature and let it stabilise
# 2. Run SCREW_ADJUST_START - homes axes and establishes Z=0 via Beacon contact
# 3. Run SFL, SFR, SBL, SBR to measure Z offset at each screw
# 4. Adjust knob and re-run macro to verify
# 5. Goal: get all four corners within 1.98-2.02mm (within 0.02mm of Z=2.0)
#
# From Qidi Community Plus4 Wiki:
# https://github.com/qidi-community/Plus4-Wiki

[gcode_macro SCREW_ADJUST_START]
description: Home axes and establish Z=0 via Beacon contact before tramming
gcode:
    _FIND_Z_EQUALS_ZERO                                 # Home and calibrate Z=0 via Beacon contact
    M104 S0                                             # Turn off hotend after calibration

[gcode_macro SFL]
description: Probe Z offset at front-left bed adjustment screw
gcode:
    {% set screw_pos_x = printer.configfile.settings.bed_screws.screw1[0] %}
    {% set screw_pos_y = printer.configfile.settings.bed_screws.screw1[1] %}
    {% set beacon_off_x = printer.configfile.settings.beacon.x_offset %}
    {% set beacon_off_y = printer.configfile.settings.beacon.y_offset %}
    G1 Z3 F600                                          # Move bed away from nozzle
    G1 X{screw_pos_x - beacon_off_x + 20} Y{screw_pos_y - beacon_off_y + 20} F6000
    PROBE PROBE_METHOD=proximity                        # Probe using eddy current
    G1 Z3 F600                                          # Move bed away from nozzle

[gcode_macro SFR]
description: Probe Z offset at front-right bed adjustment screw
gcode:
    {% set screw_pos_x = printer.configfile.settings.bed_screws.screw2[0] %}
    {% set screw_pos_y = printer.configfile.settings.bed_screws.screw2[1] %}
    {% set beacon_off_x = printer.configfile.settings.beacon.x_offset %}
    {% set beacon_off_y = printer.configfile.settings.beacon.y_offset %}
    G1 Z3 F600
    G1 X{screw_pos_x - beacon_off_x - 20} Y{screw_pos_y - beacon_off_y + 20} F6000
    PROBE PROBE_METHOD=proximity
    G1 Z3 F600

[gcode_macro SBR]
description: Probe Z offset at back-right bed adjustment screw
gcode:
    {% set screw_pos_x = printer.configfile.settings.bed_screws.screw3[0] %}
    {% set screw_pos_y = printer.configfile.settings.bed_screws.screw3[1] %}
    {% set beacon_off_x = printer.configfile.settings.beacon.x_offset %}
    {% set beacon_off_y = printer.configfile.settings.beacon.y_offset %}
    G1 Z3 F600
    G1 X{screw_pos_x - beacon_off_x - 20} Y{screw_pos_y - beacon_off_y - 20} F6000
    PROBE PROBE_METHOD=proximity
    G1 Z3 F600

[gcode_macro SBL]
description: Probe Z offset at back-left bed adjustment screw
gcode:
    {% set screw_pos_x = printer.configfile.settings.bed_screws.screw4[0] %}
    {% set screw_pos_y = printer.configfile.settings.bed_screws.screw4[1] %}
    {% set beacon_off_x = printer.configfile.settings.beacon.x_offset %}
    {% set beacon_off_y = printer.configfile.settings.beacon.y_offset %}
    G1 Z3 F600
    G1 X{screw_pos_x - beacon_off_x + 20} Y{screw_pos_y - beacon_off_y - 20} F6000
    PROBE PROBE_METHOD=proximity
    G1 Z3 F600

[gcode_macro SCREW_ADJUST_PROMPT]
description: Show Beacon tramming workflow as clickable links in console
gcode:
    RESPOND MSG="Beacon Bed Tramming - adjust knobs to achieve Z=2.0 (±0.02mm) at all corners:"
    RESPOND MSG="Step 1: [SCREW_ADJUST_START] - home and calibrate Z=0"
    RESPOND MSG="Step 2: Measure corners: [SFL] [SFR] [SBL] [SBR]"
    RESPOND MSG="Step 3: Adjust knobs and re-measure until all corners are 1.98-2.02mm"