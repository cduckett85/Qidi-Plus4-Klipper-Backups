#######################################
# Filament Loading
#######################################
# Heats hotend, homes axes, moves to purge chute, loads filament,
# then cools down and activates purge ejection arm.
#
# Usage: LOAD_FILAMENT S=250
# Default temp: 250C

[gcode_macro LOAD_FILAMENT]
description: Load filament into the hotend
variable_hotendtemp: 250
gcode:
    {% set hotendtemp = params.S|default(hotendtemp)|int %}
    {% set accel = printer.toolhead.max_accel|int %}

    M204 S10000                                         # Increase acceleration for rapid movement
    M104 S{hotendtemp}                                  # Start heating hotend early
    _CG28                                               # Home all axes if needed

    # Move clear of print area if needed
    {% if printer.gcode_move.position.y > 300 %}
        G91
        G1 Y-20 F9000
        G90
    {% endif %}

    # Move to purge chute
    G1 X93 F12000
    G1 Y312 F12000
    G1 Y316 F600
    G1 Y320 F9000
    G1 Y324 F600

    # Wait for hotend to reach temperature
    M109 S{hotendtemp}
    M118 Heat up complete

    # Prepare for loading
    G1 X93 F600
    G1 Y324 F600

    # Load filament
    G92 E0
    G1 E5 F50                                           # Slow initial extrusion
    G92 E0
    G1 E120 F300                                        # Load filament through bowden
    G92 E0
    G1 E-0.8 F200                                       # Small retract to reduce pressure

    # Cool down slightly before ejection
    G4 P300
    M106 S255                                           # Fan on full to help cooling
    M104 S{hotendtemp - 100}                            # Lower hotend temp

    G4 P5000                                            # Wait for cooling

    # Activate purge ejection arm
    G1 Y318 F9000
    G1 Y322 F600
    G1 Y318 F9000
    G1 Y322 F600
    G1 Y308 F30000
    G1 Y324 F600

    M204 S{accel}                                       # Restore original acceleration
    M118 Load finished


#######################################
# Filament Unloading
#######################################
# Homes axes, cuts filament using Y axis movement, moves to purge
# chute, heats hotend, purges remaining filament, then cools down.
#
# Usage: UNLOAD_FILAMENT S=250
# Default temp: 250C

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from the hotend
variable_hotendtemp: 250
gcode:
    {% set hotendtemp = params.S|default(hotendtemp)|int %}
    {% set accel = printer.toolhead.max_accel|int %}

    _CG28                                               # Home all axes if needed
    M204 S10000                                         # Increase acceleration for rapid movement

    # Cut filament using Y axis movement
    G1 Y150 F9000
    G1 X305 F9000
    G1 Y20 F9000
    G1 Y5 F3000
    G4 P500

    G1 Y20 F9000
    G1 Y5 F3000
    G4 P500

    # Move to purge chute
    G1 X56 F12000
    G1 Y310 F12000
    G1 Y324 F600
    G1 X93 F600

    # Heat hotend for unloading
    M106 S0                                             # Turn off fan
    M109 S{hotendtemp}                                  # Wait for hotend temp
    M118 Heat up complete

    # Purge remaining filament
    G92 E0
    G1 E5 F50                                           # Slow initial extrusion
    G1 E50 F200                                         # Purge filament
    G92 E0
    G1 E-0.8 F200                                       # Retract slightly

    # Cool down
    G4 P300
    M106 S255                                           # Fan on full
    M104 S{hotendtemp - 100}                            # Lower hotend temp

    G4 P5000                                            # Wait for cooling

    # Activate purge ejection arm
    G1 Y318 F9000
    G1 Y322 F600
    G1 Y318 F9000
    G1 Y322 F600
    G1 Y308 F30000
    G1 Y324 F600

    M204 S{accel}                                       # Restore original acceleration
    M118 Unload finished