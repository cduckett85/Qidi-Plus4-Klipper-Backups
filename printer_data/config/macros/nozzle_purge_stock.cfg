#######################################
# Nozzle Purge - Navigation
#######################################
# _MOVE_TO_CHUTE safely navigates the toolhead to the purge chute
# It is called by all other purge/wipe macros as a dependency

[gcode_macro _MOVE_TO_CHUTE]
description: Safely move nozzle over the purge chute if not already there
gcode:
    M400
    {% if (printer.gcode_move.position.x) != 95 %}
        {% if (printer.gcode_move.position.y) != 324 %}
            {% if (printer.gcode_move.position.x) < 56 %}
                G1 X56 F12000           # Move to avoid collision with stepper motor
                M400
            {% endif %}
            {% if (printer.gcode_move.position.y) != 300 %}
                G1 Y300 F12000          # Move to avoid collision with purge activation arm
                M400
            {% endif %}
            {% if (printer.gcode_move.position.x) > 56 %}
                G1 X56 F12000           # Move in line with silicon scrubbing brush
                M400
            {% endif %}
            G1 Y324 F600                # Slowly move back in line with purge chute
            G1 X95 F600                 # Move directly over the purge chute
            M400                        # Wait for all operations to complete
        {% endif %}
    {% else %}
        {% if (printer.gcode_move.position.y) != 324 %}
            G1 Y300 F12000
            G1 Y324 F600
            M400
        {% endif %}
    {% endif %}


#######################################
# Nozzle Purge - Ejection & Purging
#######################################

[gcode_macro _ACTIVATE_PURGE_EJECTION]
description: Activate purge arm to drop purged filament down chute
gcode:
    {% set hotendtemp = params.HOTEND|default(250)|int %}
    _MOVE_TO_CHUTE
    M106 S255
    G4 P5000
    M104 S{hotendtemp - 80}
    G1 Y318 F9000
    G1 Y322 F600
    G1 Y318 F9000
    G1 Y322 F600
    G1 Y308 F30000
    G1 Y324 F600

[gcode_macro _PURGE_INTO_CHUTE]
description: Purge filament into purge chute
gcode:
    {% set hotendtemp = params.HOTEND|default(250)|int %}
    _MOVE_TO_CHUTE
    G92 E0                                          # Set extruder position to 0
    G1 E5 F50                                       # Purge 5mm of filament slowly
    G92 E0                                          # Set extruder position to 0
    G1 E35 F200                                     # Purge 35mm of filament (reduced from 80mm)
    G92 E0                                          # Set extruder position to 0
    G1 E-2 F200                                     # Perform a 2mm retraction
    _ACTIVATE_PURGE_EJECTION HOTEND={hotendtemp}    # Eject the purged filament
    G1 E-1                                          # Perform a 1mm retraction


#######################################
# Nozzle Purge - Wiping
#######################################

[gcode_macro _PEI_WIPE]
description: Wipe nozzle over PEI plate - simplified from original
gcode:
    _MOVE_TO_CHUTE
    G1 X124 F6000                           # Move to wipe start position
    G1 X133 F200                            # Slow approach to PEI surface
    G1 Y321 F200                            # Initial contact position
    G1 X113 F300                            # Wipe across PEI surface
    G1 X125 F300                            # Wipe back
    G1 X113 F300                            # Wipe across again
    G1 X125 F300                            # Wipe back
    M400                                    # Wait for moves to complete
    G1 Y320 F600                            # Move away from PEI
    G1 X95 F600                             # Return to chute position
    M400

[gcode_macro _BRUSH_WIPE]
description: Wipe nozzle over silicone brush area
gcode:
    _MOVE_TO_CHUTE
    G1 Y300 F600
    G1 X95 F12000
    G1 Y314 F9000
    G1 Y324 F600
    G1 X58 F12000
    G1 X78 F12000
    G1 Y324
    G1 X58 F12000
    G1 X78 F12000
    G1 Y323.5
    G1 X58 F12000
    G1 X78 F12000
    G1 Y323
    G1 X58 F12000
    G1 X78 F12000
    G1 Y322.5
    G1 X58 F12000
    G1 X78 F12000
    G1 Y322
    G1 X58 F12000
    G1 X75 F12000
    G1 Y321.5
    G2 I0.8 J0.8 F600
    G2 I0.8 J0.8 F600
    G2 I0.8 J0.8 F600
    G1 Y324 F600
    M106 S0                                         # Turn off part cooling fan after wipe
    G1 X95 F12000
    G1 Y316 F9000
    G1 Y312 F600
    M400


#######################################
# Nozzle Purge - Main Macro
#######################################

[gcode_macro CLEAN_NOZZLE]
description: Clear nozzle of any stuck filament - purge, wipe PEI, wipe brush
gcode:
    {% set hotendtemp = params.HOTEND|default(250)|int %}
    {% set purge = params.PURGE|default(1)|int %}
    {% set pei_wipe = params.PEI_WIPE|default(1)|int %}
    {% set end_temp = params.END_TEMP|default(0)|int %}             # Temperature to cool to after cleaning
                                                                    # 0 = cool fully (default, used for manual cleans)
                                                                    # Set to probe temp in PRINT_START to skip reheat in G29

    # Ensure printer is homed before moving
    {% if not (printer.toolhead.homed_axes == "xyz") %}
        G28                                                         # Home all axes if not already homed
    {% endif %}

    # Ensure Z clearance before moving
    {% if (printer.gcode_move.position.z) < 35 %}
        G1 Z35 F900
    {% else %}
        G91
        G1 Z5 F900
        G90
    {% endif %}

    _MOVE_TO_CHUTE

    M106 S0                                                         # Turn off part cooling fan
    M109 S{hotendtemp}                                              # Wait for nozzle to reach temperature
    {% if purge == 1 %}
        _PURGE_INTO_CHUTE HOTEND={hotendtemp}                       # Purge and eject filament
    {% else %}
        _ACTIVATE_PURGE_EJECTION HOTEND={hotendtemp}                # Just eject without purging
    {% endif %}
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={hotendtemp - 70}

    {% if pei_wipe == 1 %}
        _PEI_WIPE                                                   # Wipe on PEI plate
    {% endif %}

    _BRUSH_WIPE                                                     # Wipe on silicone brush
    M118 Nozzle cleared

    # Move to safe park position
    G1 Y300 F12000
    M400
    G1 X10 F12000

    # Cool hotend down
    {% if end_temp > 0 %}
        # Cool to specified end temp - used by PRINT_START to leave nozzle at probe temp
        # _FIND_Z_EQUALS_ZERO will skip reheat since nozzle is already at probe temp
        RESPOND MSG="Nozzle clean complete - cooling to probe temp {end_temp}C..."
        M106 S255                                                   # Fan on full to help cooling
        M104 S{end_temp}                                            # Set target to probe temp instead of fully off
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={end_temp + 5}     # Wait until within 5C of probe temp
        M106 S0                                                     # Turn off fan
    {% else %}
        # Cool fully - default behavior for manual cleans
        RESPOND MSG="Nozzle clean complete - cooling fully..."
        M106 S255                                                   # Fan on full to help cooling
        M104 S{hotendtemp - 80}                                     # Lower hotend temp
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={hotendtemp - 70}  # Wait until cool
        M106 S0                                                     # Turn off fan
    {% endif %}
    M400
    M118 Nozzle cooled

#######################################
# Nozzle Purge - Material Presets
#######################################
# Fluidd converts macro names in the console into clickable links.
# CLEAN_NOZZLE_PROMPT outputs a message with material options as
# clickable links. Clicking a link auto-fills the macro name into
# the console send field and executes it.
#
# Usage: Click CLEAN_NOZZLE_PROMPT in the Fluidd macro panel,
# then click your desired material in the console output.

[gcode_macro CLEAN_NOZZLE_PROMPT]
description: Interactive nozzle cleaning - run this then click a material in the console
gcode:
    RESPOND MSG="Select material to clean nozzle:"
    RESPOND MSG="[_CLEAN_NOZZLE_PLA] [_CLEAN_NOZZLE_PETG] [_CLEAN_NOZZLE_ABS_ASA] [_CLEAN_NOZZLE_PA]"

[gcode_macro _CLEAN_NOZZLE_PLA]
description: Clean nozzle for PLA (220C, 80mm purge)
gcode:
    CLEAN_NOZZLE HOTEND=220 PURGE=1 PEI_WIPE=1

[gcode_macro _CLEAN_NOZZLE_PETG]
description: Clean nozzle for PETG (240C, 80mm purge)
gcode:
    CLEAN_NOZZLE HOTEND=240 PURGE=1 PEI_WIPE=1

[gcode_macro _CLEAN_NOZZLE_ABS_ASA]
description: Clean nozzle for ABS/ASA (260C, 80mm purge)
gcode:
    CLEAN_NOZZLE HOTEND=260 PURGE=1 PEI_WIPE=1

[gcode_macro _CLEAN_NOZZLE_PA]
description: Clean nozzle for PA/Nylon (280C, 80mm purge)
gcode:
    CLEAN_NOZZLE HOTEND=280 PURGE=1 PEI_WIPE=1