#######################################
# Nozzle Purge - Navigation
#######################################
# _MOVE_TO_CHUTE safely navigates the toolhead to the purge chute
# It is called by all other purge/wipe macros as a dependency

[gcode_macro _MOVE_TO_CHUTE]
description: Safely move nozzle over the purge chute if not already there
gcode:
    M400
    {% if (printer.gcode_move.position.x) != 95 %}
        {% if (printer.gcode_move.position.y) != 324 %}
            {% if (printer.gcode_move.position.x) < 56 %}
                G1 X56 F12000           # Move to avoid collision with stepper motor
                M400
            {% endif %}
            {% if (printer.gcode_move.position.y) != 300 %}
                G1 Y300 F12000          # Move to avoid collision with purge activation arm
                M400
            {% endif %}
            {% if (printer.gcode_move.position.x) > 56 %}
                G1 X56 F12000           # Move in line with silicon scrubbing brush
                M400
            {% endif %}
            G1 Y324 F600                # Slowly move back in line with purge chute
            G1 X95 F600                 # Move directly over the purge chute
            M400                        # Wait for all operations to complete
        {% endif %}
    {% else %}
        {% if (printer.gcode_move.position.y) != 324 %}
            G1 Y300 F12000
            G1 Y324 F600
            M400
        {% endif %}
    {% endif %}


#######################################
# Nozzle Purge - Ejection & Purging
#######################################

[gcode_macro _ACTIVATE_PURGE_EJECTION]
description: Activate purge arm to drop purged filament down chute
gcode:
    {% set hotendtemp = params.HOTEND|default(250)|int %}
    _MOVE_TO_CHUTE
    M106 S255
    G4 P5000
    M104 S{hotendtemp - 80}
    G1 Y318 F9000
    G1 Y322 F600
    G1 Y318 F9000
    G1 Y322 F600
    G1 Y308 F30000
    G1 Y324 F600

[gcode_macro _PURGE_INTO_CHUTE]
description: Purge filament into purge chute
gcode:
    {% set hotendtemp = params.HOTEND|default(250)|int %}
    _MOVE_TO_CHUTE
    G92 E0                                          # Set extruder position to 0
    G1 E5 F50                                       # Purge 5mm of filament slowly
    G92 E0                                          # Set extruder position to 0
    G1 E35 F200                                     # Purge 35mm of filament (reduced from 80mm)
    G92 E0                                          # Set extruder position to 0
    G1 E-2 F200                                     # Perform a 2mm retraction
    _ACTIVATE_PURGE_EJECTION HOTEND={hotendtemp}    # Eject the purged filament
    G1 E-1                                          # Perform a 1mm retraction


#######################################
# Nozzle Purge - Wiping
#######################################

[gcode_macro _PEI_WIPE]
description: Wipe nozzle over PEI plate - simplified from original
gcode:
    _MOVE_TO_CHUTE
    G1 X124 F6000                           # Move to wipe start position
    G1 X133 F200                            # Slow approach to PEI surface
    G1 Y321 F200                            # Initial contact position
    G1 X113 F300                            # Wipe across PEI surface
    G1 X125 F300                            # Wipe back
    G1 X113 F300                            # Wipe across again
    G1 X125 F300                            # Wipe back
    M400                                    # Wait for moves to complete
    G1 Y320 F600                            # Move away from PEI
    G1 X95 F600                             # Return to chute position
    M400

[gcode_macro _BRUSH_WIPE]
description: Wipe nozzle over silicone brush area
gcode:
    _MOVE_TO_CHUTE
    G1 Y300 F600
    G1 X95 F12000
    G1 Y314 F9000
    G1 Y324 F600
    G1 X58 F12000
    G1 X78 F12000
    G1 Y324
    G1 X58 F12000
    G1 X78 F12000
    G1 Y323.5
    G1 X58 F12000
    G1 X78 F12000
    G1 Y323
    G1 X58 F12000
    G1 X78 F12000
    G1 Y322.5
    G1 X58 F12000
    G1 X78 F12000
    G1 Y322
    G1 X58 F12000
    G1 X75 F12000
    G1 Y321.5
    G2 I0.8 J0.8 F600
    G2 I0.8 J0.8 F600
    G2 I0.8 J0.8 F600
    G1 Y324 F600
    M106 S0                                         # Turn off part cooling fan after wipe
    G1 X95 F12000
    G1 Y316 F9000
    G1 Y312 F600
    M400


#######################################
# Nozzle Purge - Main Macro
#######################################
# CLEAN_NOZZLE handles all nozzle cleaning operations.
# Called from PRINT_START for pre-probe clean and manually via material presets.
#
# Two usage modes:
#
#   Pre-probe clean (PRINT_START stage 1):
#     CLEAN_NOZZLE HOTEND={HOTEND} PURGE=0 PEI_WIPE=1 END_TEMP=175
#     - Heats to print temp, PEI wipes during cooldown, brush wipes at probe temp
#     - Holds at END_TEMP so G29 skips reheat
#     - No purge needed - bed/chamber were heating, nozzle was cold
#
#   Manual clean (material presets or console):
#     CLEAN_NOZZLE HOTEND=260 PURGE=1 PEI_WIPE=1
#     - Full clean with purge, PEI wipe, brush wipe, full cooldown
#
# Parameter summary:
#   HOTEND   - Target nozzle temperature (default 250)
#   PURGE    - 1 = purge into chute before wiping (default 1)
#   PEI_WIPE - 1 = wipe on PEI plate during cooldown (default 1)
#   END_TEMP - Temperature to hold after cleaning (default 0 = cool fully)

[gcode_macro CLEAN_NOZZLE]
description: Clear nozzle of any stuck filament - purge, wipe PEI, wipe brush
gcode:
    {% set hotendtemp = params.HOTEND|default(250)|int %}
    {% set purge = params.PURGE|default(1)|int %}
    {% set pei_wipe = params.PEI_WIPE|default(1)|int %}
    {% set end_temp = params.END_TEMP|default(0)|int %}             # 0 = cool fully, >0 = hold at this temp (e.g. probe temp)

    # Ensure printer is homed before moving
    {% if not (printer.toolhead.homed_axes == "xyz") %}
        G28                                                         # Home all axes if not already homed
    {% endif %}

    # Ensure Z clearance before moving to chute
    {% if (printer.gcode_move.position.z) < 35 %}
        G1 Z35 F3000                                                # Raise to minimum safe Z for chute travel
    {% else %}
        G91
        G1 Z5 F3000                                                 # Add 5mm clearance if already above 35mm
        G90
    {% endif %}

    _MOVE_TO_CHUTE

    #######################################
    # Heat & Purge (if enabled)
    #######################################

    M106 S0                                                         # Turn off part cooling fan before heating
    M109 S{hotendtemp}                                              # Heat nozzle to target temp and wait

    {% if purge == 1 %}
        _PURGE_INTO_CHUTE HOTEND={hotendtemp}                       # Purge filament and eject into chute
    {% else %}
        # No purge - nozzle was cold during heat up, small ooze only
        # _ACTIVATE_PURGE_EJECTION not needed since there's nothing to eject
        RESPOND MSG="Nozzle clean: skipping purge..."
    {% endif %}

    #######################################
    # PEI Wipe During Cooldown
    #######################################
    # PEI wipe happens while nozzle is actively cooling from print temp
    # This uses the cooling phase productively instead of just waiting
    # Nozzle is still hot enough to wipe cleanly at this point

    M104 S0                                                         # Turn off heater - begin cooling
    M106 S255                                                       # Fan on full to accelerate cooling

    {% if pei_wipe == 1 %}
        RESPOND MSG="Nozzle clean: PEI wipe during cooldown..."
        _PEI_WIPE                                                   # Wipe on PEI plate while nozzle cools
    {% endif %}

    #######################################
    # Brush Wipe at Probe-Safe Temp
    #######################################
    # Wait until nozzle is below contact_max_hotend_temperature (180C)
    # before brush wipe - ensures nozzle is safe for contact probing

    RESPOND MSG="Nozzle clean: waiting for nozzle to cool below 180C..."
    TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=179                    # Wait until below beacon contact max temp

    {% if end_temp > 0 %}
        M104 S{end_temp}                                            # Set hold temp (e.g. 175C probe temp)
    {% endif %}

    _BRUSH_WIPE                                                     # Final brush wipe at probe-safe temp
    M118 Nozzle cleared

    #######################################
    # Final Cooldown / Hold
    #######################################

    {% if end_temp > 0 %}
        # Hold at probe temp - used by PRINT_START so G29 skips reheat
        RESPOND MSG="Nozzle clean complete - holding at probe temp {end_temp}C..."
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={end_temp - 2} MAXIMUM={end_temp + 5}
        M106 S0                                                     # Turn off cooling fan
    {% else %}
        # Cool fully - default for manual cleans
        RESPOND MSG="Nozzle clean complete - cooling fully..."
        M104 S{hotendtemp - 80}                                     # Drop to intermediate temp
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={hotendtemp - 70}  # Wait until sufficiently cool
        M106 S0                                                     # Turn off cooling fan
    {% endif %}

    # Move to safe park position away from chute
    G1 Y300 F12000
    M400
    G1 X10 F12000
    M400
    M118 Nozzle cooled


#######################################
# Nozzle Purge - Material Presets
#######################################
# Fluidd converts macro names in the console into clickable links.
# CLEAN_NOZZLE_PROMPT outputs a message with material options as
# clickable links. Clicking a link auto-fills the macro name into
# the console send field and executes it.
#
# Usage: Click CLEAN_NOZZLE_PROMPT in the Fluidd macro panel,
# then click your desired material in the console output.
#
# Note: Material presets use full clean with purge (PURGE=1)
# and full cooldown (no END_TEMP) - suitable for manual cleaning
# between prints or filament changes.

[gcode_macro CLEAN_NOZZLE_PROMPT]
description: Interactive nozzle cleaning - run this then click a material in the console
gcode:
    RESPOND MSG="Select material to clean nozzle:"
    RESPOND MSG="[_CLEAN_NOZZLE_PLA] [_CLEAN_NOZZLE_PETG] [_CLEAN_NOZZLE_ABS_ASA] [_CLEAN_NOZZLE_PA]"

[gcode_macro _CLEAN_NOZZLE_PLA]
description: Clean nozzle for PLA (220C, 35mm purge)
gcode:
    CLEAN_NOZZLE HOTEND=220 PURGE=1 PEI_WIPE=1

[gcode_macro _CLEAN_NOZZLE_PETG]
description: Clean nozzle for PETG (240C, 35mm purge)
gcode:
    CLEAN_NOZZLE HOTEND=240 PURGE=1 PEI_WIPE=1

[gcode_macro _CLEAN_NOZZLE_ABS_ASA]
description: Clean nozzle for ABS/ASA (260C, 35mm purge)
gcode:
    CLEAN_NOZZLE HOTEND=260 PURGE=1 PEI_WIPE=1

[gcode_macro _CLEAN_NOZZLE_PA]
description: Clean nozzle for PA/Nylon (280C, 35mm purge)
gcode:
    CLEAN_NOZZLE HOTEND=280 PURGE=1 PEI_WIPE=1