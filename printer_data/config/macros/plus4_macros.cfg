#######################################
# Plus4 Specific Macros
#######################################
# This file contains macros specific to the Qidi Plus4 that are not
# covered by the other macro files. These were originally part of the
# FreeDi default macros.cfg and have been reorganized here.


#######################################
# Chamber Temperature Safety & Layer Pause
#######################################
# SET_PRINT_STATS_INFO is called every layer change by the slicer.
# This merged version combines:
# 1. Chamber heater safety - disables chamber heater above 260mm to
#    prevent hot air blowing directly onto tall prints (Plus4 specific)
# 2. Chamber temp controller - manages exhaust fan speed to prevent
#    chamber overheating
# 3. Pause at next layer - Fluidd feature to pause at the next layer
# 4. Pause at specific layer - Fluidd feature to pause at a given layer

[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: BASE_SET_PRINT_STATS_INFO_BASE
description: Layer change handler - chamber safety, temp control, and layer pause features
variable_pause_next_layer: { 'enable': False, 'call': "PAUSE" }
variable_pause_at_layer: { 'enable': False, 'layer': 0, 'call': "PAUSE" }
gcode:
    # Chamber heater safety - disable above 260mm to protect tall prints
    {% if (printer.toolhead.position.z) > 260 %}
        M141 S0
    {% endif %}

    # Pause at next layer if enabled
    {% if pause_next_layer.enable %}
        RESPOND TYPE=echo MSG='{"%s, forced by pause_next_layer" % pause_next_layer.call}'
        {pause_next_layer.call}
        SET_PAUSE_NEXT_LAYER ENABLE=0
    {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER | int == pause_at_layer.layer %}
        RESPOND TYPE=echo MSG='{"%s, forced by pause_at_layer [%d]" % (pause_at_layer.call, pause_at_layer.layer)}'
        {pause_at_layer.call}
        SET_PAUSE_AT_LAYER ENABLE=0
    {% endif %}

    BASE_SET_PRINT_STATS_INFO_BASE {rawparams}
    CHAMBER_TEMP_CONTROLLER


#######################################
# Layer Pause Control
#######################################
# These macros are used by Fluidd to pause at specific layers
# Usage: SET_PAUSE_NEXT_LAYER ENABLE=1
#        SET_PAUSE_AT_LAYER ENABLE=1 LAYER=10

[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Enable a pause at the next layer change
gcode:
    {% set pause_next_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
    {% set ENABLE = params.ENABLE | default(1) | int != 0 %}
    {% set MACRO = params.MACRO | default(pause_next_layer.call, True) %}
    SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': ENABLE, 'call': MACRO }}"

[gcode_macro SET_PAUSE_AT_LAYER]
description: Enable a pause at a specific layer number
gcode:
    {% set pause_at_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
    {% set ENABLE = params.ENABLE | int != 0 if params.ENABLE is defined
               else params.LAYER is defined %}
    {% set LAYER = params.LAYER | default(pause_at_layer.layer) | int %}
    {% set MACRO = params.MACRO | default(pause_at_layer.call, True) %}
    SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': ENABLE, 'layer': LAYER, 'call': MACRO }}"


#######################################
# Filament Sensor Control
#######################################

[gcode_macro ENABLE_ALL_SENSOR]
description: Enable all filament sensors
gcode:
    ENABLE_FILAMENT_WIDTH_SENSOR
    RESET_FILAMENT_WIDTH_SENSOR
    query_filament_width
    SET_FILAMENT_SENSOR SENSOR=filament_tangle_sensor ENABLE=1

[gcode_macro DISABLE_ALL_SENSOR]
description: Disable all filament sensors
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament_tangle_sensor ENABLE=0
    DISABLE_FILAMENT_WIDTH_SENSOR

[gcode_macro M8029]
description: Enable/disable filament tangle sensor (M8029 D1=enable, D0=disable)
gcode:
    {% if params.D is defined %}
        {% if (params.D|int) == 1 %}
            SET_FILAMENT_SENSOR SENSOR=filament_tangle_sensor ENABLE=1
        {% endif %}
        {% if (params.D|int) == 0 %}
            SET_FILAMENT_SENSOR SENSOR=filament_tangle_sensor ENABLE=0
        {% endif %}
    {% endif %}


#######################################
# Homing Utilities
#######################################

[gcode_macro HOME_IF_NEEDED]
description: Home each axis individually only if not already homed
# Note: Similar to _CG28 in utilities.cfg but homes each axis separately
# rather than all at once. Use HOME_IF_NEEDED when you need to ensure
# a specific axis is homed. Use _CG28 for general "home if needed" checks.
gcode:
    {% if "y" not in printer.toolhead.homed_axes %}
        G28 Y
    {% endif %}
    {% if "x" not in printer.toolhead.homed_axes %}
        G28 X
    {% endif %}
    {% if "z" not in printer.toolhead.homed_axes %}
        G28 Z
    {% endif %}


#######################################
# Bed Leveling & Tramming
#######################################
# RECOMMENDED: Use Beacon-based tramming macros in bed_macros.cfg
# Run SCREW_ADJUST_PROMPT for guided workflow, or SCREW_ADJUST_START
# followed by SFL, SFR, SBL, SBR to measure each corner.
#
# The macros below use the traditional probe method and are kept
# for reference but Beacon tramming is more accurate.

