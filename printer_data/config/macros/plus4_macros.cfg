#######################################
# Z Height Utilities
#######################################

[gcode_macro M290]
description: Babystep Z offset adjustment
gcode:
    SET_GCODE_OFFSET Z_ADJUST={params.Z}


#######################################
# Print Flow Control
#######################################

[gcode_macro M0]
description: Unconditional stop - pauses print
gcode:
    PAUSE

[gcode_macro M25]
description: Pause SD print
rename_existing: M9925
gcode:
    PAUSE


#######################################
# Sound Macros
#######################################
# Note: Buzzer pin PA2 must be enabled in printer.cfg to use these macros.
# Currently commented out - see [output_pin buzzer] section in printer.cfg.
# Also requires [output_pin sound] to be defined for the BEEP macro to work.

[gcode_macro BEEP]
description: Beep the buzzer - I=iterations, DUR=duration in ms
gcode:
    {% set i = params.I|default(1)|int %}
    {% set dur = params.DUR|default(100)|int %}
    {% if printer["output_pin sound"].value|int == 1 %}
        {% for iteration in range(i|int) %}
            SET_PIN PIN=buzzer VALUE=1
            G4 P{dur}
            SET_PIN PIN=buzzer VALUE=0
            G4 P{dur}
        {% endfor %}
    {% endif %}

[gcode_macro BEEP_ON]
description: Turn buzzer on continuously
gcode:
    SET_PIN PIN=buzzer VALUE=1

[gcode_macro BEEP_OFF]
description: Turn buzzer off
gcode:
    SET_PIN PIN=buzzer VALUE=0


#######################################
# PID Tuning
#######################################

[gcode_macro M303]
description: PID autotune - E=-1 for bed, E=0 for extruder, S=target temp
# Note: For chamber heater PID tuning use CHAMBER_PID_TUNE macro instead
gcode:
    {% if params.E is defined %}
        {% if params.S is defined %}
            {% if (params.E|int) == -1 %}
                RESPOND MSG="Running bed PID tune at {params.S}C..."
                PID_CALIBRATE HEATER=heater_bed TARGET={params.S|int}
            {% endif %}
            {% if (params.E|int) == 0 %}
                RESPOND MSG="Running extruder PID tune at {params.S}C..."
                PID_CALIBRATE HEATER=extruder TARGET={params.S|int}
            {% endif %}
        {% endif %}
    {% else %}
        RESPOND MSG="Usage: M303 E=-1 S=100 (bed) or M303 E=0 S=220 (extruder)"
        RESPOND MSG="For chamber heater use: [CHAMBER_PID_TUNE]"
    {% endif %}

[gcode_macro NOZZLE_PID_TUNE]
description: Run PID tuning for extruder at 220C
gcode:
    RESPOND MSG="Starting extruder PID tuning at 220C - this may take 5-10 minutes..."
    PID_CALIBRATE HEATER=extruder TARGET=220
    RESPOND MSG="Extruder PID tuning complete! Run SAVE_CONFIG to save results."

[gcode_macro BED_PID_TUNE]
description: Run PID tuning for bed at 100C
gcode:
    RESPOND MSG="Starting bed PID tuning at 100C - this may take 10-20 minutes..."
    PID_CALIBRATE HEATER=heater_bed TARGET=100
    RESPOND MSG="Bed PID tuning complete! Run SAVE_CONFIG to save results."

[gcode_macro CHAMBER_PID_TUNE]
description: Run PID tuning for chamber heater at 50C
gcode:
    RESPOND MSG="Starting chamber PID tuning at 50C - this may take 5-10 minutes..."
    PID_CALIBRATE HEATER=chamber TARGET=50
    RESPOND MSG="Chamber PID tuning complete! Run SAVE_CONFIG to save results."


#######################################
# Tuning Macros
#######################################

[gcode_macro M900]
description: Set pressure advance factor (K) and smooth time (T)
# Note: PA is normally set by the slicer, but this macro allows runtime
# override from the console without re-slicing. Useful for live tuning.
gcode:
    {% if params.K is defined %}
        SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
    {% if params.T is defined %}
        SET_PRESSURE_ADVANCE SMOOTH_TIME={params.T}
    {% endif %}

[gcode_macro M204]
description: Set acceleration - supports S, or P and T parameters
rename_existing: M99204
gcode:
    {% if params.S is defined %}
        {% set s = params.S|float %}
    {% endif %}
    {% if params.P is defined %}
        {% if params.T is defined %}
            {% set s = [params.P|float, params.T|float] | min %}
        {% endif %}
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL={s}
    SET_VELOCITY_LIMIT ACCEL_TO_DECEL={s/2}


#######################################
# Input Shaping
#######################################

[gcode_macro SHAPER_CALIBRATE]
description: Run input shaper calibration between 30-130Hz
rename_existing: RESHAPER_CALIBRATE
gcode:
    RESHAPER_CALIBRATE FREQ_START=30 FREQ_END=130

[gcode_macro INPUT_SHAPING_CALIBRATE]
description: Full input shaping workflow - calibrate, pause, save and restart
gcode:
    SHAPER_CALIBRATE
    PAUSE
    SAVE_CONFIG
    RESTART