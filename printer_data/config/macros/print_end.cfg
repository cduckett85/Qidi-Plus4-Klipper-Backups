#######################################
# Print End
#######################################

[gcode_macro PRINT_END]
description: Execute after printing - called by slicer end gcode
gcode:
    {% set UNLOAD = params.UNLOAD|default(0)|int %}
    {% set UNLOAD_TEMP = params.UNLOAD_TEMP|default(250)|int %}

    # Reset idle timeout
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

    # Clear pause state
    CLEAR_PAUSE

    # Wait for all buffered moves to complete
    M400

    # Move nozzle away from print while retracting
    G91                                                             # Relative positioning
    G1 X-2 Y-2 E-3 F300                                             # Slow wipe move with retraction (F300 is intentionally slow, speed up if needed)
    G1 Z10 F3000                                                    # Raise nozzle 10mm
    G90                                                             # Absolute positioning

    # Turn off all fans
    M106 P0 S0                                                      # Turn off part cooling fan
    M106 P2 S0                                                      # Turn off auxiliary fan
    M106 P3 S0                                                      # Turn off exhaust fan

    # Turn off all heaters
    M104 S0                                                         # Turn off hotend
    M140 S0                                                         # Turn off bed
    M141 S0                                                         # Turn off chamber

    # Move nozzle to purge chute
    _MOVE_TO_CHUTE

    # Lower bed if not already low enough
    {% if (printer.gcode_move.position.z) < 200 %}
        G1 Z200 F12000
    {% endif %}
    M400

    # Reset speed and flow
    M220 S100                                                       # Reset speed to 100%
    M221 S100                                                       # Reset flow to 100%

    # Redundant heater off - safety measure to ensure heaters don't stay on
    M104 S0
    M140 S0
    M141 S0

    # Reset Z offset - clears thermal expansion offset applied during print
    SET_GCODE_OFFSET Z=0
    # _BEACON_REMOVE_NOZZLE_TEMP_OFFSET           # RatOS thermal expansion compensation system - not currently installed
    # _BEACON_SET_NOZZLE_TEMP_OFFSET RESET=True   # See: https://github.com/YanceyA/BeaconPrinterTools
                                                  # Look into installing this after printer is up and running

    # Disable steppers
    SET_STEPPER_ENABLE STEPPER=stepper_x enable=0
    SET_STEPPER_ENABLE STEPPER=stepper_y enable=0
    SET_STEPPER_ENABLE STEPPER=stepper_z enable=1                   # Keep Z enabled to hold bed position
    SET_STEPPER_ENABLE STEPPER=stepper_z1 enable=1
    SET_STEPPER_ENABLE STEPPER=extruder enable=0

    # Clear bed mesh
    BED_MESH_CLEAR

    # Reset bed mesh mode to KAMP adaptive for next print
    G31

    # Unload filament - only useful when Qidi Box MMU is installed
    # The Plus4 has a built-in toolhead cutter but without the QB there is
    # no mechanism to retract the filament - leave UNLOAD=0 until QB is installed
    {% if UNLOAD == 1 %}
        UNLOAD_FILAMENT S={UNLOAD_TEMP}                             # Cut and unload - requires Qidi Box MMU
    {% endif %}

    # Turn off case light (comment out or remove if you prefer light stays on after print)
    # SET_PIN PIN=caselight VALUE=0

    # Disable all motors
    M84

    RESPOND MSG="Print Complete!"