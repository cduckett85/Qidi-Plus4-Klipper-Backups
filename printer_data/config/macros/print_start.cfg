#######################################
# Print Start
#######################################

[gcode_macro PRINT_START]
# Description: Execute before printing - called by slicer start gcode
# Slicer start gcode should call:
# PRINT_START BED=[bed_temperature] HOTEND=[nozzle_temperature] CHAMBER=[chamber_temperature] MATERIAL=[filament_type] PURGE=1 PEI_WIPE=1 TOTAL_LAYERS=[total_layer_count]
gcode:
    {% set BED = params.BED|int %}
    {% set HOTEND = params.HOTEND|int %}
    {% set CHAMBER = params.CHAMBER|default(0)|int %}
    {% set MATERIAL = params.MATERIAL|default("ASA")|string %}
    {% set PURGE = params.PURGE|default(1)|int %}
    {% set PEI_WIPE = params.PEI_WIPE|default(1)|int %}
    {% set TOTAL_LAYERS = params.TOTAL_LAYERS|default(0)|int %}

    RESPOND MSG="Print Starting: {MATERIAL} - Bed:{BED}C Hotend:{HOTEND}C Chamber:{CHAMBER}C"

    # Report total layer count to Moonraker/Fluidd
    SET_PRINT_STATS_INFO TOTAL_LAYER={TOTAL_LAYERS}

    # Inform nozzle offset system of target hotend temperature
    SET_GCODE_VARIABLE MACRO=_APPLY_NOZZLE_OFFSET VARIABLE=hotend_temp VALUE={HOTEND}

    # Set MPC material parameters
    # _SET_MPC_MATERIAL MATERIAL={MATERIAL}

    # Initial setup
    RESPOND MSG="Print Start: Turning on case light and resetting state..."
    SET_PIN PIN=caselight VALUE=1                                   # Turn on case light
    BED_MESH_CLEAR                                                  # Clear previous bed mesh
    SET_GCODE_OFFSET Z=0                                            # Reset Z offset

    # Turn off fans initially
    M106 P2 S0                                                      # Turn off auxiliary fan
    M106 P3 S0                                                      # Turn off exhaust fan
    M106 S0                                                         # Turn off part cooling fan

    # Start heating bed and chamber early
    RESPOND MSG="Print Start: Heating bed to {BED}C..."
    M140 S{BED}                                                     # Start bed heating
    {% if CHAMBER > 0 %}
        RESPOND MSG="Print Start: Heating chamber to {CHAMBER}C..."
        M141 S{CHAMBER}                                             # Start chamber heating
    {% endif %}

    # Home all axes
    RESPOND MSG="Print Start: Homing all axes..."
    G28

    # Wait for bed temperature
    {% if BED > 0 %}
        RESPOND MSG="Print Start: Waiting for bed to reach {BED}C..."
        M190 S{BED}                                                 # Wait for bed temp
        RESPOND MSG="Print Start: Bed at temp, soaking for 60 seconds..."
        G4 P60000                                                   # 60 second bed soak
    {% endif %}

    # Wait for chamber temperature if required
    {% if CHAMBER > 0 %}
        RESPOND MSG="Print Start: Waiting for chamber to reach {CHAMBER}C..."
        M191 S{CHAMBER}                                             # Wait for chamber temp
    {% endif %}

    # Full bed preparation - homing, z-tilt, contact calibration, bed mesh
    RESPOND MSG="Print Start: Running bed preparation - Z offset, tilt, and mesh..."
    G29

    # Clean nozzle after probing, before final heat - moved from pre-G28 position
    RESPOND MSG="Print Start: Cleaning nozzle at {HOTEND}C..."
    CLEAN_NOZZLE HOTEND={HOTEND} PURGE={PURGE} PEI_WIPE={PEI_WIPE}  # Originally before G28, moved post-G29 for better sequencing

    # Apply filament specific Z offset
    RESPOND MSG="Print Start: Applying {MATERIAL} Z offset..."
    _SET_FILAMENT_OFFSET MATERIAL={MATERIAL}

    # Move to safe position before heating hotend
    # G0 Z15 F600
    # G0 X5 Y5 F6000
    RESPOND MSG="Print Start: Parking toolhead..."
    SMART_PARK                                                      # Park near print area before final hotend warmup

    # Turn on chamber fan if required
    {% if CHAMBER > 0 %}
        M106 P3 S255                                                # Turn on exhaust fan
    {% endif %}

    # Wait for hotend temperature
    RESPOND MSG="Print Start: Heating hotend to {HOTEND}C..."
    M109 S{HOTEND}

    # Set print acceleration and extruder mode
    M204 S10000
    M83                                                             # Relative extruder mode

    # Ensure temperatures are maintained
    M140 S{BED}
    {% if CHAMBER > 0 %}
        M141 S{CHAMBER}
    {% endif %}

    # Set current layer for display
    SET_PRINT_STATS_INFO CURRENT_LAYER=1

    RESPOND MSG="Print Starting!"


#######################################
# Nozzle Wipe Utility
#######################################

[gcode_macro WIPIN]
description: Quick nozzle wipe utility
gcode:
    {% set HOTEND = params.HOTEND|default(250)|int %}
    {% set PURGE = params.PURGE|default(1)|int %}
    {% set PEI_WIPE = params.PEI_WIPE|default(1)|int %}
    CLEAN_NOZZLE HOTEND={HOTEND} PURGE={PURGE} PEI_WIPE={PEI_WIPE}