#######################################
# Print Start
#######################################

[gcode_macro PRINT_START]
# Description: Execute before printing - called by slicer start gcode
# Slicer start gcode should call:
# PRINT_START BED=[bed_temperature] HOTEND=[nozzle_temperature] CHAMBER=[chamber_temperature] MATERIAL=[filament_type] PURGE=1 PEI_WIPE=1 TOTAL_LAYERS=[total_layer_count]
#
# Sequence overview:
#   1.  Initial setup - case light, mesh clear, Z reset, fans off
#   2.  Start bed and chamber heating (non-blocking)
#   3.  Enable air mixing fans to speed up chamber heat distribution
#   4.  G28 - home all axes (single home for entire sequence)
#   5.  Move to center at Z=5 for better air circulation during heat up
#   6.  Wait for bed temp (M190)
#   7.  Wait for chamber to reach CHAMBER-10C
#   8.  Turn off air mixing fans
#   9.  Stage 1 nozzle clean - heat to probe temp, brush wipe only (no purge)
#  10.  G29 SKIP_HOME=1 - Z offset, tilt, mesh (skips redundant home)
#  11.  Stage 2 nozzle clean - full CLEAN_NOZZLE with purge and PEI wipe
#  12.  Apply filament Z offset
#  13.  SMART_PARK near print area
#  14.  Chamber exhaust fan on
#  15.  Wait for hotend temp (M109)
#  16.  Set acceleration, extruder mode, confirm temps
gcode:
    {% set BED = params.BED|int %}
    {% set HOTEND = params.HOTEND|int %}
    {% set CHAMBER = params.CHAMBER|default(0)|int %}
    {% set MATERIAL = params.MATERIAL|default("ASA")|string %}
    {% set PURGE = params.PURGE|default(1)|int %}
    {% set PEI_WIPE = params.PEI_WIPE|default(1)|int %}
    {% set TOTAL_LAYERS = params.TOTAL_LAYERS|default(0)|int %}
    {% set CHAMBER_PREHEAT = [CHAMBER - 10, 0] | max %}             # Start G29 when chamber is 10C from target

    RESPOND MSG="Print Starting: {MATERIAL} - Bed:{BED}C Hotend:{HOTEND}C Chamber:{CHAMBER}C"

    # Report total layer count to Moonraker/Fluidd
    SET_PRINT_STATS_INFO TOTAL_LAYER={TOTAL_LAYERS}

    # Inform nozzle offset system of target hotend temperature
    SET_GCODE_VARIABLE MACRO=_APPLY_NOZZLE_OFFSET VARIABLE=hotend_temp VALUE={HOTEND}

    # Set MPC material parameters
    # _SET_MPC_MATERIAL MATERIAL={MATERIAL}

    #######################################
    # Initial Setup
    #######################################

    RESPOND MSG="Print Start: Initial setup..."
    SET_PIN PIN=caselight VALUE=1                                   # Turn on case light
    BED_MESH_CLEAR                                                  # Clear previous bed mesh
    SET_GCODE_OFFSET Z=0                                            # Reset Z offset

    # Turn off all fans initially
    M106 P2 S0                                                      # Turn off auxiliary fan
    M106 P3 S0                                                      # Turn off exhaust fan
    M106 S0                                                         # Turn off part cooling fan

    #######################################
    # Heating & Air Circulation
    #######################################

    # Start bed and chamber heating early - non-blocking
    RESPOND MSG="Print Start: Heating bed to {BED}C..."
    M140 S{BED}                                                     # Start bed heating (non-blocking)
    {% if CHAMBER > 0 %}
        RESPOND MSG="Print Start: Heating chamber to {CHAMBER}C..."
        M141 S{CHAMBER}                                             # Start chamber heating (non-blocking)

        # Enable air mixing fans to speed up chamber heat distribution
        # Inspired by FxWoody - circulates air for faster even heating
        RESPOND MSG="Print Start: Enabling air mixing fans..."
        M106 S255                                                   # Part cooling fan full speed for air mixing
        M106 P2 S255                                                # Auxiliary fan full speed for air mixing
    {% endif %}

    # Single home for entire PRINT_START sequence
    # G29 will use SKIP_HOME=1 to avoid re-homing
    RESPOND MSG="Print Start: Homing all axes..."
    G28

    # Move to center at low Z for better air circulation during heat up
    {% if CHAMBER > 0 %}
        RESPOND MSG="Print Start: Moving to center for air circulation..."
        G0 Z5 F3000                                                 # Lower bed for better air circulation (increased from F600)
        G0 X152 Y152 F6000                                          # Move toolhead to bed center
    {% endif %}

    # Wait for bed to reach target temperature
    {% if BED > 0 %}
        RESPOND MSG="Print Start: Waiting for bed to reach {BED}C..."
        M190 S{BED}                                                 # Wait for bed temp (blocking)
        {% if CHAMBER == 0 %}
            RESPOND MSG="Print Start: No chamber heating - soaking bed for 5 minutes..."
            G4 P300000                                              # 5 min bed soak when no chamber (PLA/PETG)
        {% endif %}
    {% endif %}

    # Wait for chamber to reach preheat threshold (10C below target)
    # G29 runs while chamber climbs the final 10C - saves time
    {% if CHAMBER > 0 %}
        RESPOND MSG="Print Start: Waiting for chamber to reach {CHAMBER_PREHEAT}C (10C from target)..."
        M191 S{CHAMBER_PREHEAT}                                     # Wait for chamber preheat threshold (blocking)

        # Turn off air mixing fans before probing
        RESPOND MSG="Print Start: Turning off air mixing fans..."
        M106 S0                                                     # Turn off part cooling fan
        M106 P2 S0                                                  # Turn off auxiliary fan
    {% endif %}

    #######################################
    # Stage 1 - Pre-probe Nozzle Clean
    #######################################

    # Quick brush wipe at probe temp before contact probing
    # Removes any ooze/residue that could affect Z accuracy
    # No purge or PEI wipe - just a clean tip for probing
    # Nozzle stays at probe temp so _FIND_Z_EQUALS_ZERO doesn't need to reheat
    {% set PROBE_TEMP = HOTEND - 85 %}
    RESPOND MSG="Print Start: Stage 1 nozzle clean - heating to probe temp {PROBE_TEMP}C..."
    M109 S{PROBE_TEMP}                                              # Heat to probe temp - same temp G29 will use
    _BRUSH_WIPE                                                     # Quick brush wipe - removes ooze without purge cycle
    RESPOND MSG="Print Start: Pre-probe wipe complete..."

    #######################################
    # Bed Preparation
    #######################################

    # SKIP_HOME=1 because we already homed above
    # Nozzle is already at probe temp from Stage 1 wipe
    RESPOND MSG="Print Start: Running bed preparation - Z offset, tilt, and mesh..."
    G29 SKIP_HOME=1                                                 # Z offset, tilt, mesh - skips redundant home

    #######################################
    # Stage 2 - Full Nozzle Clean
    #######################################

    # Full purge and wipe at print temp after probing
    # Ensures nozzle is perfectly clean before first layer
    RESPOND MSG="Print Start: Stage 2 full nozzle clean at {HOTEND}C..."
    CLEAN_NOZZLE HOTEND={HOTEND} PURGE={PURGE} PEI_WIPE={PEI_WIPE}

    #######################################
    # Final Positioning & Heating
    #######################################

    # Apply filament specific Z offset
    RESPOND MSG="Print Start: Applying {MATERIAL} Z offset..."
    _SET_FILAMENT_OFFSET MATERIAL={MATERIAL}

    # Park near print area before final hotend warmup
    # Manual park coordinates kept as fallback if SMART_PARK causes issues:
    RESPOND MSG="Print Start: Parking toolhead near print area..."
    SMART_PARK                                                      # Park near print area - re-enabled after Z speed improvements
    # G0 Z15 F3000
    # G0 X5 Y5 F6000

    # Turn on exhaust fan if chamber heating required
    {% if CHAMBER > 0 %}
        M106 P3 S255                                                # Turn on exhaust fan
    {% endif %}

    # Wait for hotend to reach print temperature
    RESPOND MSG="Print Start: Heating hotend to {HOTEND}C..."
    M109 S{HOTEND}                                                  # Wait for hotend (brief - CLEAN_NOZZLE already heated it)

    #######################################
    # Print Ready
    #######################################

    # Set print acceleration and extruder mode
    M204 S10000                                                     # Set acceleration
    M83                                                             # Relative extruder mode

    # Confirm all temperatures are maintained
    M140 S{BED}                                                     # Confirm bed temp target
    {% if CHAMBER > 0 %}
        M141 S{CHAMBER}                                             # Confirm chamber temp target
    {% endif %}

    # Set current layer for Fluidd display
    SET_PRINT_STATS_INFO CURRENT_LAYER=1

    RESPOND MSG="Print Starting!"


#######################################
# Nozzle Wipe Utility
#######################################

[gcode_macro WIPIN]
description: Quick nozzle wipe utility - manually trigger nozzle clean from Fluidd
gcode:
    {% set HOTEND = params.HOTEND|default(250)|int %}
    {% set PURGE = params.PURGE|default(1)|int %}
    {% set PEI_WIPE = params.PEI_WIPE|default(1)|int %}
    CLEAN_NOZZLE HOTEND={HOTEND} PURGE={PURGE} PEI_WIPE={PEI_WIPE}#######################################
# Print Start
#######################################

[gcode_macro PRINT_START]
# Description: Execute before printing - called by slicer start gcode
# Slicer start gcode should call:
# PRINT_START BED=[bed_temperature] HOTEND=[nozzle_temperature] CHAMBER=[chamber_temperature] MATERIAL=[filament_type] TOTAL_LAYERS=[total_layer_count]
#
# Sequence overview:
#   1.  Initial setup - case light, mesh clear, Z reset, fans off
#   2.  Start bed and chamber heating (non-blocking)
#   3.  Enable air mixing fans to speed up chamber heat distribution
#   4.  G28 - home all axes (single home for entire sequence)
#   5.  Move to center at Z=5 for better air circulation during heat up
#   6.  Wait for bed temp (M190)
#   7.  Wait for chamber to reach CHAMBER-10C
#   8.  Turn off air mixing fans
#   9.  Nozzle clean - heat to print temp, PEI wipe during cooldown,
#       brush wipe at probe temp, hold at probe temp for G29
#  10.  G29 SKIP_HOME=1 - Z offset, tilt, mesh (skips redundant home)
#  11.  Apply filament Z offset
#  12.  SMART_PARK near print area
#  13.  Chamber exhaust fan on
#  14.  Wait for hotend temp (M109)
#  15.  LINE_PURGE - KAMP adaptive purge line near print area
#  16.  Set acceleration, extruder mode, confirm temps
gcode:
    {% set BED = params.BED|int %}
    {% set HOTEND = params.HOTEND|int %}
    {% set CHAMBER = params.CHAMBER|default(0)|int %}
    {% set MATERIAL = params.MATERIAL|default("ASA")|string %}
    {% set TOTAL_LAYERS = params.TOTAL_LAYERS|default(0)|int %}
    {% set CHAMBER_PREHEAT = [CHAMBER - 10, 0] | max %}             # Start G29 when chamber is 10C from target
    {% set PROBE_TEMP = HOTEND - 85 %}                              # Probe temp - matches _FIND_Z_EQUALS_ZERO calculation

    RESPOND MSG="Print Starting: {MATERIAL} - Bed:{BED}C Hotend:{HOTEND}C Chamber:{CHAMBER}C"

    # Report total layer count to Moonraker/Fluidd
    SET_PRINT_STATS_INFO TOTAL_LAYER={TOTAL_LAYERS}

    # Inform nozzle offset system of target hotend temperature
    SET_GCODE_VARIABLE MACRO=_APPLY_NOZZLE_OFFSET VARIABLE=hotend_temp VALUE={HOTEND}

    # Set MPC material parameters
    # _SET_MPC_MATERIAL MATERIAL={MATERIAL}

    #######################################
    # Initial Setup
    #######################################

    RESPOND MSG="Print Start: Initial setup..."
    SET_PIN PIN=caselight VALUE=1                                   # Turn on case light
    BED_MESH_CLEAR                                                  # Clear previous bed mesh
    SET_GCODE_OFFSET Z=0                                            # Reset Z offset

    # Turn off all fans initially
    M106 P2 S0                                                      # Turn off auxiliary fan
    M106 P3 S0                                                      # Turn off exhaust fan
    M106 S0                                                         # Turn off part cooling fan

    #######################################
    # Heating & Air Circulation
    #######################################

    # Start bed and chamber heating early - non-blocking
    RESPOND MSG="Print Start: Heating bed to {BED}C..."
    M140 S{BED}                                                     # Start bed heating (non-blocking)
    {% if CHAMBER > 0 %}
        RESPOND MSG="Print Start: Heating chamber to {CHAMBER}C..."
        M141 S{CHAMBER}                                             # Start chamber heating (non-blocking)

        # Enable air mixing fans to speed up chamber heat distribution
        # Exhaust fan intentionally off - would exhaust heated air and slow heat up
        RESPOND MSG="Print Start: Enabling air mixing fans..."
        M106 S255                                                   # Part cooling fan full speed for air mixing
        M106 P2 S255                                                # Auxiliary fan full speed for air mixing
    {% endif %}

    # Single home for entire PRINT_START sequence
    # G29 will use SKIP_HOME=1 to avoid re-homing
    RESPOND MSG="Print Start: Homing all axes..."
    G28

    # Move to center at low Z for better air circulation during heat up
    {% if CHAMBER > 0 %}
        RESPOND MSG="Print Start: Moving to center for air circulation..."
        G0 Z5 F3000                                                 # Lower bed for better air circulation
        G0 X152 Y152 F6000                                          # Move toolhead to bed center
    {% endif %}

    # Wait for bed to reach target temperature
    {% if BED > 0 %}
        RESPOND MSG="Print Start: Waiting for bed to reach {BED}C..."
        M190 S{BED}                                                 # Wait for bed temp (blocking)
        {% if CHAMBER == 0 %}
            RESPOND MSG="Print Start: No chamber heating - soaking bed for 5 minutes..."
            G4 P300000                                              # 5 min bed soak when no chamber (PLA/PETG)
        {% endif %}
    {% endif %}

    # Wait for chamber to reach preheat threshold (10C below target)
    # G29 runs while chamber climbs the final 10C - saves time
    {% if CHAMBER > 0 %}
        RESPOND MSG="Print Start: Waiting for chamber to reach {CHAMBER_PREHEAT}C (10C from target)..."
        M191 S{CHAMBER_PREHEAT}                                     # Wait for chamber preheat threshold (blocking)

        # Turn off air mixing fans before nozzle clean and probing
        RESPOND MSG="Print Start: Turning off air mixing fans..."
        M106 S0                                                     # Turn off part cooling fan
        M106 P2 S0                                                  # Turn off auxiliary fan
    {% endif %}

    #######################################
    # Nozzle Clean - Pre-probe
    #######################################
    # Heat to print temp, PEI wipe during cooldown, brush wipe at probe temp
    # Nozzle held at probe temp after clean so G29 skips reheat - saves time
    # No purge needed - nozzle was cold during bed/chamber heat up
    # LINE_PURGE after print start handles pre-print filament flow

    RESPOND MSG="Print Start: Nozzle clean - heating to {HOTEND}C, PEI wipe during cooldown, hold at {PROBE_TEMP}C..."
    CLEAN_NOZZLE HOTEND={HOTEND} PURGE=0 PEI_WIPE=1 END_TEMP={PROBE_TEMP}

    #######################################
    # Bed Preparation
    #######################################

    # SKIP_HOME=1 because we already homed above
    # Nozzle already at probe temp from CLEAN_NOZZLE - G29 skips reheat
    RESPOND MSG="Print Start: Running bed preparation - Z offset, tilt, and mesh..."
    G29 SKIP_HOME=1                                                 # Z offset, tilt, mesh - skips redundant home

    #######################################
    # Final Positioning & Heating
    #######################################

    # Apply filament specific Z offset
    RESPOND MSG="Print Start: Applying {MATERIAL} Z offset..."
    _SET_FILAMENT_OFFSET MATERIAL={MATERIAL}

    # Park near print area before final hotend warmup
    # Fallback manual park if SMART_PARK causes issues:
    # G0 Z15 F3000
    # G0 X5 Y5 F6000
    RESPOND MSG="Print Start: Parking toolhead near print area..."
    SMART_PARK                                                      # Park near print area

    # Turn on exhaust fan if chamber heating required
    {% if CHAMBER > 0 %}
        M106 P3 S255                                                # Turn on exhaust fan
    {% endif %}

    # Wait for hotend to reach print temperature
    RESPOND MSG="Print Start: Heating hotend to {HOTEND}C..."
    M109 S{HOTEND}                                                  # Wait for hotend

    #######################################
    # Print Ready
    #######################################

    # Set print acceleration and extruder mode
    M204 S10000                                                     # Set acceleration
    M83                                                             # Relative extruder mode

    # Confirm all temperatures are maintained
    M140 S{BED}                                                     # Confirm bed temp target
    {% if CHAMBER > 0 %}
        M141 S{CHAMBER}                                             # Confirm chamber temp target
    {% endif %}

    # Set current layer for Fluidd display
    SET_PRINT_STATS_INFO CURRENT_LAYER=1

    RESPOND MSG="Print Starting!"
