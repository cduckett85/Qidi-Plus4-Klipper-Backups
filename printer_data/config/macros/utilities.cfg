#######################################
# Beacon Homing Macros
#######################################

[gcode_macro _BEACON_HOME_PRE_X]
gcode:
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.55

[gcode_macro _BEACON_HOME_POST_X]
gcode:
    G1 X20 F1200
    M400
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer.configfile.settings['tmc2240 stepper_x'].run_current}

[gcode_macro _BEACON_HOME_PRE_Y]
gcode:
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.45

[gcode_macro _BEACON_HOME_POST_Y]
gcode:
    G1 Y10 F1200
    M400
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer.configfile.settings['tmc2240 stepper_y'].run_current}


#######################################
# Conditional Homing
#######################################

[gcode_macro _CG28]
description: Home all axes if not already homed
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}


#######################################
# Z Offset - Save Macro
#######################################
# Run this macro when the first layer looks perfect during a print.
# Captures the current babystepping value and writes it permanently
# into the beacon model_offset so it persists across restarts.
#
# Workflow:
#   1. Start print
#   2. Babystep Z until first layer looks perfect
#   3. Click SAVE_Z_OFFSET in Fluidd/Mobileraker
#   4. Done - offset is saved permanently, no manual editing needed
#
# Note: Run during the print while babystep is still active.
# SAVE_CONFIG will restart Klipper after saving.

[gcode_macro SAVE_Z_OFFSET]
description: Save current babystepping to beacon model offset - run when first layer looks perfect
gcode:
    Z_OFFSET_APPLY_PROBE                                            # Apply current Z gcode offset to beacon model_offset
    SAVE_CONFIG                                                     # Write to printer.cfg and restart Klipper


#######################################
# Maintenance Macros
#######################################

[gcode_macro MOVE_HEAD]
description: Move head around after lubricating rods
gcode:
    {% set speed = params.SPEED|default(10000)|float %}
    _CG28
    G1 Z10 F600                                                     # Move bed 10mm away from nozzle
    {% for i in range(10) %}
        G1 X0 Y0 F{speed}
        G1 X305 Y305 F{speed}
        G1 X0 Y305 F{speed}
        G1 X305 Y305 F{speed}
    {% endfor %}
    G1 X152.5 Y152.5 F{speed}

[gcode_macro LUBE_APPLY]
description: After applying lube, works it into the bearings
gcode:
    {% set num_loops = params.LOOPS|default(4)|int %}
    G28
    {% for i in range(1, num_loops) %}
        G0 X5 Y5 Z10 F2400
        G0 X295 Y295 Z275 F2400
    {% endfor %}
    G0 X150 Y150 Z10 F3600                                         # Return to print ready position


#######################################
# Z Speed Test
#######################################
# Tests Z travel at increasing speeds to find max speed before grinding
# Run macros in order from Fluidd or Mobileraker - emergency stop if grinding heard
# Use Z_SPEED_TEST SPEED=xxx DIST=yyy from console for custom speed/distance

[gcode_macro Z_SPEED_TEST]
description: Test Z travel at a given speed - use to find max speed before grinding
gcode:
    {% set SPEED = params.SPEED|default(800)|int %}
    {% set DIST = params.DIST|default(100)|int %}
    RESPOND MSG="Z speed test: F{SPEED} ({(SPEED/60)|round(1)}mm/s) - traveling {DIST}mm up and down"
    G28 Z                                                           # Home Z only
    G1 Z{DIST} F{SPEED}
    G1 Z10 F{SPEED}
    RESPOND MSG="Z speed test complete - did you hear grinding? If not, try a higher speed."


#######################################
# Temperature Overrides
#######################################

[gcode_macro M141]
description: Set chamber temperature
gcode:
    {% if printer["heater_generic chamber"] is defined %}
        {% set s = params.S|float %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={s}
    {% endif %}

[gcode_macro M191]
description: Wait for chamber temperature
gcode:
    {% if printer["heater_generic chamber"] is defined %}
        {% set s = params.S|float %}
        M141 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
        {% if s != 0 %}
            TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={s-2}
        {% endif %}
    {% endif %}

[gcode_macro M106]
description: Control fan speeds
gcode:
    {% set p = params.P|default(0)|int %}
    {% if p == 2 %}
        {% if params.S is defined %}
            SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED={(params.S|float / 255.0)}
        {% else %}
            SET_FAN_SPEED FAN=auxiliary_cooling_fan SPEED=1
        {% endif %}
    {% endif %}
    {% if p == 0 %}
        {% if params.S is defined %}
            SET_FAN_SPEED FAN=cooling_fan SPEED={(params.S|float / 255.0)}
        {% else %}
            SET_FAN_SPEED FAN=cooling_fan SPEED=1
        {% endif %}
    {% endif %}

[gcode_macro M109]
description: Wait for hotend temperature
rename_existing: M109.1
gcode:
    {% set s = params.S|float %}
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}    # Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s-2} MAXIMUM={s+5}   # Wait within ±n degrees
    {% endif %}

[gcode_macro M190]
description: Wait for bed temperature
rename_existing: M190.1
gcode:
    {% set s = params.S|float %}
    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}    # Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s-2} MAXIMUM={s+5} # Wait within ±n degrees
    {% endif %}