#######################################
# Beacon Homing Macros
#######################################

[gcode_macro _BEACON_HOME_PRE_X]
gcode:
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.55

[gcode_macro _BEACON_HOME_POST_X]
gcode:
    G1 X20 F1200
    M400
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer.configfile.settings['tmc2240 stepper_x'].run_current}

[gcode_macro _BEACON_HOME_PRE_Y]
gcode:
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.45

[gcode_macro _BEACON_HOME_POST_Y]
gcode:
    G1 Y10 F1200
    M400
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer.configfile.settings['tmc2240 stepper_y'].run_current}


#######################################
# Conditional Homing
#######################################

[gcode_macro _CG28]
description: Home all axes if not already homed
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}


#######################################
# Maintenance Macros
#######################################

[gcode_macro MOVE_HEAD]
description: Move head around after lubricating rods
gcode:
    {% set speed = params.SPEED|default(10000)|float %}
    _CG28
    G1 Z10 F600                                                 # Move bed 10mm away from nozzle
    {% for i in range(10) %}
        G1 X0 Y0 F{speed}
        G1 X305 Y305 F{speed}
        G1 X0 Y305 F{speed}
        G1 X305 Y305 F{speed}
    {% endfor %}
    G1 X152.5 Y152.5 F{speed}

[gcode_macro LUBE_APPLY]
description: After applying lube, works it into the bearings
gcode:
    {% set num_loops = params.LOOPS|default(4)|int %}
    G28
    {% for i in range(1, num_loops) %}
        G0 X5 Y5 Z10 F2400
        G0 X295 Y295 Z275 F2400
    {% endfor %}
    G0 X150 Y150 Z10 F3600                                     # Return to print ready position


#######################################
# Z Speed Test
#######################################
# Tests Z travel at increasing speeds to find max speed before grinding
# Run macros in order from Fluidd or Mobileraker - emergency stop if grinding heard
# Use Z_SPEED_TEST SPEED=xxx DIST=yyy from console for custom speed/distance

[gcode_macro Z_SPEED_TEST]
description: Test Z travel at a given speed - use to find max speed before grinding
gcode:
    {% set SPEED = params.SPEED|default(800)|int %}
    {% set DIST = params.DIST|default(100)|int %}
    RESPOND MSG="Z speed test: F{SPEED} ({(SPEED/60)|round(1)}mm/s) - traveling {DIST}mm up and down"
    G28
    G1 Z{DIST} F{SPEED}
    G1 Z10 F{SPEED}
    RESPOND MSG="Z speed test complete - did you hear grinding? If not, try a higher speed."

[gcode_macro Z_SPEED_TEST_600]
description: Test Z at F600 (10.0mm/s)
gcode:
    Z_SPEED_TEST SPEED=600

