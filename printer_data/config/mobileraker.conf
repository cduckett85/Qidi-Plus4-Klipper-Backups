#######################################
# Mobileraker Companion Configuration
#######################################
# Mobileraker companion provides push notifications for print
# status, progress, and errors to the Mobileraker mobile app.
#
# See: https://github.com/Clon1998/mobileraker_companion


#######################################
# General Settings
#######################################

[general]
language: en
timezone: US/Central                                    # Fort Worth, Texas
eta_format: %%m/%%d/%%Y, %%H:%%M:%%S                    # US date format (MM/DD/YYYY)
include_snapshot: True                                  # Include webcam snapshot in notifications (supporter feature)


#######################################
# Printer Configuration
#######################################

[printer QidiPlus4]
moonraker_uri: ws://127.0.0.1:7125/websocket
moonraker_api_key: False                                # Set to API key if force_logins is enabled in moonraker
snapshot_uri: http://127.0.0.1/webcam/?action=snapshot  # Webcam snapshot URL for notifications
snapshot_rotation: 0                                    # Snapshot rotation in degrees (0, 90, 180, 270)
ignore_filament_sensors:                                # Comma separated list of sensor names to ignore
                                                        # e.g. for MMU setups - do not include sensor type prefix