#######################################
# Beacon Probe Configuration
#######################################
# Beacon RevH Normal mount by stew675
# Mount offsets: x_offset=0, y_offset=-18.8
# See: https://www.printables.com/model/1170120-beacon3d-mount-for-qidi-plus4

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_72D5E6FF5157383837202020FF052405-if00

# Probe offsets from nozzle - specific to stew675 mount
x_offset: 0
y_offset: -18.8

# Mesh scanning settings
mesh_main_direction: x
mesh_runs: 2
accel_axes_map: x, y, z
# is_non_critical: false                              # Kalico only - not supported in mainline Klipper


#######################################
# Beacon Contact Settings
#######################################
# contact_max_hotend_temperature limits hotend temp during contact probing
# to protect the Beacon coil and prevent bed surface damage.
# 180C is conservative - increase carefully if needed for high temp materials.

contact_max_hotend_temperature: 180


#######################################
# Beacon Homing Settings
#######################################
# home_method: proximity uses eddy current for routine homing (fast, no contact)
# home_method_when_homed: proximity stays in proximity mode when already homed
# home_autocalibrate: never relies on saved model (we have one in SAVE_CONFIG)
#
# To switch to contact homing for more accuracy:
#   home_method: contact
#   home_autocalibrate: unhomed

home_y_before_x: true                                  # Home Y before X for sensorless homing stability
home_xy_position: 152.5, 152.5                         # Z home position - bed center
home_z_hop: 5                                          # Z hop height before XY moves during homing
home_z_hop_speed: 10                                   # Reduced from 30 - was causing grinding on Z retract after homing
home_xy_move_speed: 300                                # Speed of XY moves during homing
home_method: proximity                                 # Use proximity for routine homing
home_method_when_homed: proximity                      # Stay in proximity mode when already homed
home_autocalibrate: never                              # Don't auto calibrate - use saved model

# Homing macros - defined in macros/utilities.cfg
home_gcode_pre_x: _BEACON_HOME_PRE_X                   # Reduce X current before homing
home_gcode_post_x: _BEACON_HOME_POST_X                 # Restore X current after homing
home_gcode_pre_y: _BEACON_HOME_PRE_Y                   # Reduce Y current before homing
home_gcode_post_y: _BEACON_HOME_POST_Y                 # Restore Y current after homing


#######################################
# Beacon Auto-Calibration Settings
#######################################
# These settings control the contact probing behavior during
# _FIND_Z_EQUALS_ZERO calibration runs.

autocal_speed: 3                                       # Contact probing speed (mm/s)
autocal_accel: 100                                     # Contact probing acceleration
autocal_retract_dist: 2                                # Retract distance between samples
autocal_retract_speed: 10                              # Retract speed between samples
autocal_sample_count: 3                                # Number of samples per calibration
autocal_tolerance: 0.008                               # Maximum variance between samples
autocal_max_retries: 10                                # Maximum retries if tolerance not met


#######################################
# Resonance Testing
#######################################
# Beacon RevH has a built-in accelerometer - no separate ADXL345 needed.
# sweeping_period: 0 disables sweeping mode (simpler, recommended for most users)
# To enable sweeping: sweeping_period: 1

[resonance_tester]
accel_chip: beacon
probe_points:
    152.5, 152.5, 15                                   # Test at bed center, 15mm height
# accel_per_hz: 100                                    # Optional: adjust if needed
# sweeping_accel: 400                                  # Optional: sweeping acceleration
sweeping_period: 0                                     # Sweeping off - set to 1 to enable