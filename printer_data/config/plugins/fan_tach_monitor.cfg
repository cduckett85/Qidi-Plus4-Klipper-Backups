#######################################
# Hotend Fan Safety Monitor
#######################################
# Monitors hotend fan RPM every 3 seconds and pauses the print
# if the fan stops unexpectedly. Prevents heat creep damage to
# the hotend and cold zone.
#
# Requires a 3-wire fan with tachometer_pin defined.
# See: https://www.klipper3d.org/Config_Reference.html#heater_fan
#
# Author: alch3my#9819

[delayed_gcode CHECK_ALL_FANS]
initial_duration: 30                                    # Increased from 1 to 30 seconds to allow tachometer to stabilize on startup
gcode:
    HOTEND_FAN_CHECK
    UPDATE_DELAYED_GCODE ID=CHECK_ALL_FANS DURATION=3   # Check every 3 seconds


#######################################
# Fan Check Macro
#######################################

[gcode_macro HOTEND_FAN_CHECK]
description: Check hotend fan RPM and trigger stoppage routine if fan has stopped
variable_he_stop_count: 0
gcode:
    {% set min_rpm = 3000|float %}                      # Minimum acceptable RPM
    {% set max_consecutive_stops = 3 %}                 # Number of consecutive stops before pausing
    {% set rpm = printer['heater_fan hotend_fan'].rpm|float %}
    {% set he_target = printer[printer.toolhead.extruder].target|float %}
    {% set he_temp = printer[printer.toolhead.extruder].temperature|float %}
    {% set fan_on_temp = printer.configfile.settings['heater_fan hotend_fan'].heater_temp|float %}
    {% set he_stop_count = printer["gcode_macro HOTEND_FAN_CHECK"].he_stop_count|int %}

    {% if (he_target >= fan_on_temp) and (rpm < min_rpm) and (he_temp >= fan_on_temp) %}
        # Fan should be running but RPM is too low - increment stop counter
        SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=he_stop_count VALUE={he_stop_count + 1}
        M118 WARNING: Fan stoppage detected ({he_stop_count+1}/{max_consecutive_stops}).
        M400
        {% if printer["gcode_macro HOTEND_FAN_CHECK"].he_stop_count|int >= max_consecutive_stops-1 %}
            FAN_STOPPAGE_ROUTINE
        {% endif %}
    {% else %}
        # Fan is running normally - reset stop counter
        SET_GCODE_VARIABLE MACRO=HOTEND_FAN_CHECK VARIABLE=he_stop_count VALUE=0
    {% endif %}


#######################################
# Fan Stoppage Response
#######################################

[gcode_macro FAN_STOPPAGE_ROUTINE]
description: Pause print and turn off hotend when fan stoppage is detected
gcode:
    {% if printer['pause_resume'].is_paused|int == 0 %}
        M117 !!FAN STOPPAGE!!
        M118 FAN STOPPAGE DETECTED. PAUSING...
        PAUSE                                           # Park toolhead and save state
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0 # Turn off hotend to prevent damage
        # Note: hotend will automatically reheat on RESUME since etemp is saved by PAUSE macro
    {% endif %}